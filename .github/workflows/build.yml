name: Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout
        # Pinned to immutable commit SHA (S-09); update via Dependabot/Renovate.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Verify JAR contains required resources
        # Clean-checkout assertion: the packaged plugin must contain its runtime
        # defaults so a CI-built artifact is usable (S-03).
        shell: bash
        run: |
          jar=$(ls build/libs/MineCICD-*.jar | head -n 1)
          if [ -z "$jar" ]; then
            echo "No MineCICD jar found in build/libs" >&2
            exit 1
          fi
          for f in config.yml plugin.yml messages.yml example_script.sh secrets.yml; do
            if ! unzip -l "$jar" | grep -q " $f$"; then
              echo "Missing required resource in $jar: $f" >&2
              exit 1
            fi
          done
          echo "All required resources present in $jar"

      - name: Upload build artifacts
        if: matrix.java == '21'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MineCICD-${{ github.sha }}
          path: build/libs/MineCICD-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload to release
    needs: build
    if: github.event_name == 'release' && github.repository == 'Bruderjulian/MineCICD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon

      - name: Verify JAR contains required resources
        shell: bash
        run: |
          jar=$(ls build/libs/MineCICD-*.jar | head -n 1)
          if [ -z "$jar" ]; then
            echo "No MineCICD jar found in build/libs" >&2
            exit 1
          fi
          for f in config.yml plugin.yml messages.yml example_script.sh secrets.yml; do
            if ! unzip -l "$jar" | grep -q " $f$"; then
              echo "Missing required resource in $jar: $f" >&2
              exit 1
            fi
          done
          echo "All required resources present in $jar"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/libs/MineCICD-*.jar
          fail_on_unmatched_files: true